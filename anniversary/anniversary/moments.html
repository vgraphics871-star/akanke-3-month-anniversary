<!DOCTYPE html><html lang="en"><head><title>Beautiful Moments With You</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400&family=Caveat:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<main class="wrap">
<header class="head"><span class="eyebrow rise" style="--d:1s">Our Album</span><h2 class="rise" style="--d:1.2s">Beautiful Moments With You</h2><div class="gold rise" style="--d:1.4s"></div><p class="rise" style="--d:1.6s"><em>Tap any photo to see it larger.</em></p></header>
<div class="gal">
<figure class="reveal"><div class="ph"><img src="images/photo1.jpg" alt="Akanke in white, standing beside me"></div><figcaption>Radiant in white</figcaption></figure>
<figure class="reveal"><div class="ph"><img src="images/photo2.jpg" alt="Akanke smiling in green as I lean in"></div><figcaption>Close enough to whisper</figcaption></figure>
<figure class="reveal"><div class="ph"><img src="images/photo3.jpg" alt="Akanke and me looking at each other"></div><figcaption>Eyes only for each other</figcaption></figure>
<figure class="reveal"><div class="ph"><img src="images/photo4.jpg" alt="Akanke and me laughing"></div><figcaption>Laughing together</figcaption></figure>
</div>
<div class="note reveal"><button class="btn ghost" id="noteBtn" data-burst>A note hidden in the album</button><p id="note">Of all the evenings, I am most grateful for the one where you said yes. ♥</p></div>
<p style="text-align:center;margin-top:4rem" class="reveal"><a class="btn" href="letter.html">Read My Letter</a></p>
</main>
<div class="lb"><button class="x" aria-label="Close">×</button><button class="pv" aria-label="Previous">‹</button><img alt=""><p></p><button class="nx" aria-label="Next">›</button></div>
<script src="app.js"></script></body></html>
